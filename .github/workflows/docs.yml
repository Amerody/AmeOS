# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the kernel and the Doxygen documentation, then publishes the HTML to
# GitHub Pages (https://<user>.github.io/<repo>/).
#
# Runs on every push to main, and by hand from the Actions tab ("Run workflow").
# Needs Settings -> Pages -> Source set to "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The code uses C23 constexpr, which needs Clang 19 or newer.
  # Ubuntu 24.04 ships Clang 18, so LLVM comes from apt.llvm.org.
  LLVM_VERSION: 20
  PRESET: rpi4-debug # debug preset = internal docs (decision records, static functions)

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install LLVM, Ninja and Doxygen
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION" ninja-build doxygen
          # The toolchain file looks in $LLVM_ROOT/bin first.
          echo "LLVM_ROOT=/usr/lib/llvm-$LLVM_VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build kernel and docs
        run: cmake --build --preset "$PRESET" --target docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
